<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite ❤️</title>

<style>

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    height: 100vh;
    overflow: hidden;

    background: linear-gradient(
        135deg,
        #89cff0 0%,
        #b5a8ff 50%,
        #f8b6d2 100%
    );

    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

/* Brilhos do fundo */
body::before{
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;

    background-image:
        radial-gradient(circle, rgba(255,255,255,.8) 2px, transparent 2px),
        radial-gradient(circle, rgba(255,255,255,.5) 1px, transparent 1px);

    background-size: 120px 120px, 80px 80px;
    opacity: .5;

    animation: brilho 15s linear infinite;
}

/* Card principal */
.container{
    text-align: center;

    background: rgba(255,255,255,0.22);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    border: 1px solid rgba(255,255,255,0.3);

    padding: 40px;
    border-radius: 30px;

    width: 90%;
    max-width: 550px;

    color: #2f2f2f;

    box-shadow:
        0 20px 40px rgba(0,0,0,.15),
        0 0 30px rgba(255,255,255,.2);

    z-index: 10;

    animation: aparecer 1.2s ease;
}

h1{
    font-size: 2.8rem;
    margin-bottom: 20px;
    color: #6c4df6;
}

p{
    font-size: 1.1rem;
    line-height: 1.8;
    margin-bottom: 25px;
}

h2{
    margin-bottom: 30px;
    font-size: 1.5rem;
    color: #4d4d4d;
}

/* Área dos botões */
.buttons{
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
}

/* Botões */
.buttons button{
    padding: 15px 25px;
    border-radius: 50px;
    border: none;
    font-size: 1rem;
    cursor: pointer;
    transition: .3s;
    font-weight: bold;
}

/* Botão SIM */
.sim{
    background: linear-gradient(
        135deg,
        #ff77b7,
        #ff4f8b
    );

    color: white;
    box-shadow: 0 5px 15px rgba(255,79,139,.4);
}

.sim:hover{
    transform: scale(1.08);
}

/* Botão NÃO */
.nao{
    background: white;
    color: #444;
    box-shadow: 0 5px 15px rgba(0,0,0,.1);
    position: relative;
}

/* Mensagem final */
.mensagem-final{
    display: none;
    margin-top: 25px;
    font-size: 1.4rem;
    animation: aparecer 1s ease-in-out;
    color: #444;
    font-weight: bold;
}

/* Corações */
.heart{
    position: absolute;
    width: 20px;
    height: 20px;
    background: #ff4f8b;
    transform: rotate(45deg);
    animation: floatUp linear forwards;
}

.heart::before,
.heart::after{
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    background: #ff4f8b;
    border-radius: 50%;
}

.heart::before{
    top: -10px;
    left: 0;
}

.heart::after{
    left: -10px;
    top: 0;
}

/* Animações */
@keyframes brilho{
    from{
        transform: translateY(0);
    }

    to{
        transform: translateY(-100px);
    }
}

@keyframes floatUp{
    from{
        transform: translateY(0) rotate(45deg);
        opacity: 1;
    }

    to{
        transform: translateY(-100vh) rotate(45deg);
        opacity: 0;
    }
}

@keyframes aparecer{
    from{
        opacity: 0;
        transform: scale(.8);
    }

    to{
        opacity: 1;
        transform: scale(1);
    }
}

/* Responsividade */
@media (max-width: 500px){

    .container{
        padding: 30px 20px;
    }

    h1{
        font-size: 2rem;
    }

    h2{
        font-size: 1.2rem;
    }

    p{
        font-size: 1rem;
    }

    .buttons{
        flex-direction: column;
        align-items: center;
    }

    .buttons button{
        width: 90%;
    }
}

</style>
</head>

<body>

<div class="container">

    <h1>Oii minha princesa! </h1>

    <p>
        Por mais que tente, a opção de "não" não é uma opção válida.
        Gostaria de te fazer um convite. 💕
    </p>

    <h2>
        Você aceita comemorar mais um dia dos namorados comigo? 
    </h2>

    <div class="buttons">

        <button class="sim" onclick="aceitou()">
            Com certeza SIM!!! 💕
        </button>

        <button class="nao" id="NoBtn">
            Não
        </button>

    </div>

    <div class="mensagem-final" id="mensagemFinal">
        É claro que aceita KKKKKKK <br><br>
        Você não vive sem mim! 😘
    </div>

</div>

<script>

const noBtn = document.getElementById('NoBtn');
const mensagemFinal = document.getElementById('mensagemFinal');

/* Botão fugindo */
noBtn.addEventListener('mouseover', () => {

    alert('Eu avisei! Não é uma opção válida 😝');

    const randomX = Math.floor(Math.random() * (window.innerWidth - 120));
    const randomY = Math.floor(Math.random() * (window.innerHeight - 80));

    noBtn.style.position = 'absolute';
    noBtn.style.left = `${randomX}px`;
    noBtn.style.top = `${randomY}px`;
});

/* Clique no SIM */
function aceitou(){

    mensagemFinal.style.display = 'block';

    for(let i = 0; i < 50; i++){

        const heart = document.createElement('div');

        heart.classList.add('heart');

        heart.style.left = `${Math.random() * window.innerWidth}px`;

        heart.style.top = `${window.innerHeight}px`;

        heart.style.animationDuration = `${Math.random() * 2 + 3}s`;

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 5000);
    }
}

</script>

</body>
</html>
